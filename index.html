<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Toast jig</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&amp;display=block">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;-webkit-font-feature-settings:'liga';font-feature-settings:'liga';-webkit-font-smoothing:antialiased}
.jig-types .ms{font-variation-settings:'FILL' 1}
p{margin:0}
[data-anchor="jig-bar"] button:focus-visible{outline:2px solid #84caff;outline-offset:-2px}

html{background:#e5e7eb}
body{padding:24px}
#app{width:1360px;margin:0 auto;box-shadow:0 0 0 1px #d1d5dc}
</style>
</head>
<body>
<div id="app"></div>
<template id="jig-template">
<div data-anchor="toast-jig" style="width: 1360px; min-height: 1500px; background: #ffffff; color: #111827; font-size: 13px; line-height: 18px;">
<div data-anchor="jig-bar" style="background: #111827; color: #f9fafb; padding: 14px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 28px; font-size: 12px; line-height: 16px; border-bottom: 1px solid #1f2937;">
<span style="font-weight: 600; font-size: 13px; color: #ffffff; margin-right: 4px;">Toast jig</span>
<div role="group" aria-label="View" style="display: flex; align-items: center; gap: 8px;"><span style="color: #9ca3af; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;">View</span><div style="display: inline-flex; border: 1px solid #374151; border-radius: 6px; overflow: hidden;"><sc-for list="{{jig.view}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<sc-if value="{{isPage}}" hint-placeholder-val="{{false}}"><div role="group" aria-label="Page" style="display: flex; align-items: center; gap: 8px;"><span style="color: #9ca3af; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;">Page</span><div style="display: inline-flex; border: 1px solid #374151; border-radius: 6px; overflow: hidden;"><sc-for list="{{jig.page}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div></sc-if>
<sc-if value="{{showLightCtl}}" hint-placeholder-val="{{true}}"><div role="group" aria-label="Light border" style="display: flex; align-items: center; gap: 8px;"><span style="color: #9ca3af; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;">Light border</span><div style="display: inline-flex; border: 1px solid #374151; border-radius: 6px; overflow: hidden;"><sc-for list="{{jig.light}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div></sc-if>
<sc-if value="{{showDarkCtl}}" hint-placeholder-val="{{true}}"><div role="group" aria-label="Dark style" style="display: flex; align-items: center; gap: 8px;"><span style="color: #9ca3af; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;">Dark style</span><div style="display: inline-flex; border: 1px solid #374151; border-radius: 6px; overflow: hidden;"><sc-for list="{{jig.dark}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div></sc-if>
<sc-if value="{{isPage}}" hint-placeholder-val="{{false}}"><div role="group" aria-label="Toast type" style="display: flex; align-items: center; gap: 8px;"><span style="color: #9ca3af; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;">Toast type</span><div style="display: inline-flex; border: 1px solid #374151; border-radius: 6px; overflow: hidden;"><sc-for list="{{jig.type}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div></sc-if>
<div role="group" aria-label="Title" style="display: flex; align-items: center; gap: 8px;"><span style="color: #9ca3af; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;">Title</span><div style="display: inline-flex; border: 1px solid #374151; border-radius: 6px; overflow: hidden;"><sc-for list="{{jig.title}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<div role="group" aria-label="Link" style="display: flex; align-items: center; gap: 8px;"><span style="color: #9ca3af; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;">Link</span><div style="display: inline-flex; border: 1px solid #374151; border-radius: 6px; overflow: hidden;"><sc-for list="{{jig.link}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<div role="group" aria-label="Lines" style="display: flex; align-items: center; gap: 8px;"><span style="color: #9ca3af; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;">Lines</span><div style="display: inline-flex; border: 1px solid #374151; border-radius: 6px; overflow: hidden;"><sc-for list="{{jig.lines}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div>
<sc-if value="{{isPage}}" hint-placeholder-val="{{false}}"><div role="group" aria-label="Side nav" style="display: flex; align-items: center; gap: 8px;"><span style="color: #9ca3af; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;">Side nav</span><div style="display: inline-flex; border: 1px solid #374151; border-radius: 6px; overflow: hidden;"><sc-for list="{{jig.nav}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div></sc-if>
<sc-if value="{{isPage}}" hint-placeholder-val="{{false}}"><div role="group" aria-label="Toast" style="display: flex; align-items: center; gap: 8px;"><span style="color: #9ca3af; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; font-size: 11px;">Toast</span><div style="display: inline-flex; border: 1px solid #374151; border-radius: 6px; overflow: hidden;"><sc-for list="{{jig.toast}}" as="o" hint-placeholder-count="2"><button type="button" aria-pressed="{{o.pressed}}" onClick="{{o.pick}}" style="{{o.style}}">{{o.label}}</button></sc-for></div></div></sc-if>
<button type="button" data-anchor="jig-reset" onClick="{{resetJig}}" style="margin-left: auto; display: inline-flex; align-items: center; gap: 6px; border: 1px solid #374151; border-radius: 6px; background: transparent; color: #f9fafb; font: inherit; font-size: 12px; line-height: 16px; font-weight: 600; padding: 8px 12px; cursor: pointer;"><span class="ms" aria-hidden="true" style="font-size: 16px;">restart_alt</span>Reset</button>
</div>
<sc-if value="{{isTypes}}" hint-placeholder-val="{{true}}">
<div class="jig-types" style="box-sizing: border-box; padding: 8px 40px 40px; display: flex; flex-direction: column; gap: 32px;">
<sc-for list="{{types}}" as="t" hint-placeholder-count="4">
    <section aria-label="{{t.name}} toast" style="display: flex; flex-direction: column; gap: 12px; padding-top: 24px; border-top: 1px solid #e5e7eb;">
      <div style="display: grid; grid-template-columns: 160px repeat(2, minmax(0, 1fr)); gap: 24px; align-items: start;">
        <div style="display: flex; flex-direction: column; gap: 4px;">
          <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600;">{{t.name}}</h2>
          <span style="color: #4a5565;">Icon: {{t.icon}}</span>
          <span style="align-self: flex-start; display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 9999px; background: {{t.closeTagBg}}; border: 1px solid {{t.closeTagBorder}}; color: {{t.closeTagText}}; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap;">{{t.closeLabel}}</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 12px; font-weight: 600; color: #4a5565; letter-spacing: 0.04em;">LIGHT · {{lightLabel}} BORDER</div>
          <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.lBg}}; border: 1px solid #0000001a;"></span><strong>Fill</strong> {{t.lBgName}}</div>
          <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.lBorder}}; border: 1px solid #0000001a;"></span><strong>Border</strong> {{t.lBorderName}}</div>
          <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.lText}}; border: 1px solid #0000001a;"></span><strong>Text, icon</strong> {{t.lTextName}}</div>
          <div><strong>Contrast</strong> {{t.lRatio}} to 1, passes</div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 12px; font-weight: 600; color: #4a5565; letter-spacing: 0.04em;">DARK · {{styleLabel}}</div>
          <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.dBg}}; border: 1px solid #0000001a;"></span><strong>Fill</strong> {{t.dBgName}}</div>
          <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.dBorder}}; border: 1px solid #0000001a;"></span><strong>Border</strong> {{t.dBorderName}}</div>
          <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{t.dText}}; border: 1px solid #0000001a;"></span><strong>Text, icon</strong> {{t.dTextName}}</div>
          <div><strong>Contrast</strong> {{t.dRatio}} to 1, passes</div>
        </div>
      </div>
      <div style="display: grid; grid-template-columns: 160px repeat(2, minmax(0, 1fr)); gap: 24px;">
        <div></div>
        <div style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px; display: flex; justify-content: center;">
          <div role="status" style="display: flex; align-items: flex-start; gap: 10px; background: {{t.lBg}}; border: 1px solid {{t.lBorder}}; border-radius: 8px; box-shadow: 0 10px 15px -3px #0000001a, 0 4px 6px -4px #0000001a; padding: 12px 16px; min-width: 400px; max-width: 100%; box-sizing: border-box; font-size: 14px; line-height: 20px;">
            <span class="ms" aria-hidden="true" style="font-size: 20px; margin-top: 2px; color: {{t.lText}};">{{t.icon}}</span>
            <div style="flex: 1; min-width: 0; margin-top: 2px; color: {{t.lText}};">
              <sc-if value="{{showTitle}}" hint-placeholder-val="{{false}}"><p style="font-weight: 600;">{{t.title}}</p></sc-if>
              <p style="font-weight: {{t.bodyWeight}};">{{t.body}}<sc-if value="{{t.hasLink}}" hint-placeholder-val="{{false}}"> <a href="#" style="color: inherit; font-weight: 600; text-decoration: underline;">{{t.link}}</a></sc-if></p>
            </div>
            <button type="button" aria-label="Dismiss notification" style="margin-left: auto; flex-shrink: 0; width: 24px; height: 24px; border: 0; padding: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;"><span class="ms" aria-hidden="true" style="font-size: 18px; color: {{t.lText}};">close</span></button>
          </div>
        </div>
        <div style="background: #030712; border: 1px solid #1f2937; border-radius: 12px; padding: 24px; display: flex; justify-content: center;">
          <div role="status" style="display: flex; align-items: flex-start; gap: 10px; background: {{t.dBg}}; border: 1px solid {{t.dBorder}}; border-radius: 8px; box-shadow: 0 10px 15px -3px #0000001a, 0 4px 6px -4px #0000001a; padding: 12px 16px; min-width: 400px; max-width: 100%; box-sizing: border-box; font-size: 14px; line-height: 20px;">
            <span class="ms" aria-hidden="true" style="font-size: 20px; margin-top: 2px; color: {{t.dText}};">{{t.icon}}</span>
            <div style="flex: 1; min-width: 0; margin-top: 2px; color: {{t.dText}};">
              <sc-if value="{{showTitle}}" hint-placeholder-val="{{false}}"><p style="font-weight: 600;">{{t.title}}</p></sc-if>
              <p style="font-weight: {{t.bodyWeight}};">{{t.body}}<sc-if value="{{t.hasLink}}" hint-placeholder-val="{{false}}"> <a href="#" style="color: inherit; font-weight: 600; text-decoration: underline;">{{t.link}}</a></sc-if></p>
            </div>
            <button type="button" aria-label="Dismiss notification" style="margin-left: auto; flex-shrink: 0; width: 24px; height: 24px; border: 0; padding: 0; border-radius: 4px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;"><span class="ms" aria-hidden="true" style="font-size: 18px; color: {{t.dText}};">close</span></button>
          </div>
        </div>
      </div>
    </section>
  </sc-for>
</div>
</sc-if>
<sc-if value="{{isPage}}" hint-placeholder-val="{{false}}">
<div style="width: 1360px; box-sizing: border-box; padding: 40px; background: #ffffff; color: #111827; font-size: 13px; line-height: 18px;">

  <section aria-label="Success toast spec" style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 12px; padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; margin-bottom: 32px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h2 style="margin: 0; font-size: 18px; line-height: 24px; font-weight: 600;">{{typeName}} toast</h2>
      <span style="display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 9999px; background: #eff8ff; border: 1px solid #b2ddff; color: #175cd3; font-size: 12px; line-height: 16px; font-weight: 500;">Proposal</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 24px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; font-weight: 600; color: #4a5565; letter-spacing: 0.04em;">SIZE</div>
        <div><strong>Height</strong> 50px for one line, 68px for two</div>
        <div><strong>Width</strong> Fits the message. Min 400px, max 50% of the content. Longer messages wrap to a second line</div>
        <div><strong>Padding</strong> 12px top and bottom, 16px sides</div>
        <div><strong>Corners</strong> 8px</div>
        <div><strong>Border</strong> 1px</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; font-weight: 600; color: #4a5565; letter-spacing: 0.04em;">TEXT AND ICON</div>
        <div><strong>Font</strong> Inter 14px, medium (500)</div>
        <div><strong>Line height</strong> 20px</div>
        <div><strong>Icon</strong> 20px filled check</div>
        <div><strong>Gap</strong> 10px</div>
        <div><strong>Lines</strong> One is best. Wraps at the max width. Icon and x stay lined up with the first line</div>
        <div><strong>Close</strong> Always an 18px x, same color as the text</div>
        <div><strong>Closes</strong> {{closesText}}</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; font-weight: 600; color: #4a5565; letter-spacing: 0.04em;">COLORS, LIGHT · {{lightLabel}} BORDER</div>
        <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{L.bg}}; border: 1px solid #0000001a;"></span><strong>Fill</strong> {{L.bgName}}</div>
        <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{L.border}}; border: 1px solid #0000001a;"></span><strong>Border</strong> {{L.borderName}}</div>
        <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{L.text}}; border: 1px solid #0000001a;"></span><strong>Text, icon</strong> {{L.textName}}</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; font-weight: 600; color: #4a5565; letter-spacing: 0.04em;">COLORS, DARK · {{darkLabel}}</div>
        <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{D.bg}}; border: 1px solid #0000001a;"></span><strong>Fill</strong> {{D.bgName}}</div>
        <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{D.border}}; border: 1px solid #0000001a;"></span><strong>Border</strong> {{D.borderName}}</div>
        <div style="display: flex; align-items: center; gap: 8px;"><span style="width: 16px; height: 16px; border-radius: 4px; background: {{D.text}}; border: 1px solid #0000001a;"></span><strong>Text, icon</strong> {{D.textName}}</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 12px; font-weight: 600; color: #4a5565; letter-spacing: 0.04em;">ACCESSIBILITY</div>
        <div><strong>Light</strong> {{L.ratio}} to 1, passes</div>
        <div><strong>Dark</strong> {{D.ratio}} to 1, passes</div>
        <div style="color: #4a5565;">Rule: text needs at least 4.5 to 1 (WCAG AA)</div>
      </div>
    </div>
    <div style="color: #4a5565;"><strong style="color: #111827;">Position</strong> 24px from the top of the content area, centered on the content (not the whole screen).</div>
  </section>

  <div aria-hidden="true" style="display: flex; align-items: flex-end; height: 72px; margin-bottom: 10px;">
    <div style="width: {{navW}}; flex: 0 0 auto;"></div>
    <div style="flex: 1; display: grid; grid-template-columns: 1fr 2fr 1fr; gap: 8px;">
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="background: #0c1a3d; color: #ffffff; font-weight: 600; font-size: 13px; line-height: 16px; padding: 8px 12px; border-radius: 6px;">25%</div>
        <div style="height: 20px; border-left: 2px dotted #0c1a3d;"></div>
        <div style="position: relative; align-self: stretch; height: 8px; border: 2px solid #0c1a3d; border-bottom: 0; border-radius: 2px 2px 0 0;"><div style="position: absolute; left: 50%; top: -6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 9999px; background: #0c1a3d;"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="background: #0c1a3d; color: #ffffff; font-weight: 600; font-size: 13px; line-height: 16px; padding: 8px 12px; border-radius: 6px;">Max 50%</div>
        <div style="height: 20px; border-left: 2px dotted #0c1a3d;"></div>
        <div style="position: relative; align-self: stretch; height: 8px; border: 2px solid #0c1a3d; border-bottom: 0; border-radius: 2px 2px 0 0;"><div style="position: absolute; left: 50%; top: -6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 9999px; background: #0c1a3d;"></div></div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: center;">
        <div style="background: #0c1a3d; color: #ffffff; font-weight: 600; font-size: 13px; line-height: 16px; padding: 8px 12px; border-radius: 6px;">25%</div>
        <div style="height: 20px; border-left: 2px dotted #0c1a3d;"></div>
        <div style="position: relative; align-self: stretch; height: 8px; border: 2px solid #0c1a3d; border-bottom: 0; border-radius: 2px 2px 0 0;"><div style="position: absolute; left: 50%; top: -6px; width: 10px; height: 10px; margin-left: -5px; border-radius: 9999px; background: #0c1a3d;"></div></div>
      </div>
    </div>
  </div>

<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; display: flex; outline: 1px solid #e5e7eb; background: {{page}}; font-size: 14px; line-height: 20px;">

  <sc-if value="{{expanded}}" hint-placeholder-val="{{true}}">
  <nav aria-label="Side menu" style="width: 230px; flex: 0 0 230px; box-sizing: border-box; border-right: 1px solid {{line}}; background: {{surface}}; padding: 16px 12px; display: flex; flex-direction: column; gap: 6px;">
    <div style="display: flex; align-items: center; gap: 10px; height: 40px; margin-bottom: 20px; padding: 0 4px;">
      <div style="width: 32px; height: 32px; border-radius: 6px; background: {{bar}};"></div>
      <div style="width: 80px; height: 12px; border-radius: 6px; background: {{bar}};"></div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 8px;"><div style="width: 18px; height: 18px; border-radius: 4px; background: {{bar}};"></div><div style="width: 72px; height: 10px; border-radius: 5px; background: {{barStrong}};"></div></div>
    <div style="display: flex; align-items: center; height: 36px; padding: 0 8px 0 38px; border-radius: 6px; background: {{active}};"><div style="width: 78px; height: 10px; border-radius: 5px; background: {{barStrong}};"></div></div>
    <div style="display: flex; align-items: center; height: 36px; padding: 0 8px 0 38px;"><div style="width: 88px; height: 10px; border-radius: 5px; background: {{bar}};"></div></div>
    <div style="display: flex; align-items: center; height: 36px; padding: 0 8px 0 38px;"><div style="width: 64px; height: 10px; border-radius: 5px; background: {{bar}};"></div></div>
    <div style="display: flex; align-items: center; height: 36px; padding: 0 8px 0 38px;"><div style="width: 70px; height: 10px; border-radius: 5px; background: {{bar}};"></div></div>
    <div style="display: flex; align-items: center; height: 36px; padding: 0 8px 0 38px;"><div style="width: 44px; height: 10px; border-radius: 5px; background: {{bar}};"></div></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 8px; margin-top: 12px;"><div style="width: 18px; height: 18px; border-radius: 4px; background: {{bar}};"></div><div style="width: 120px; height: 10px; border-radius: 5px; background: {{bar}};"></div></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 8px;"><div style="width: 18px; height: 18px; border-radius: 4px; background: {{bar}};"></div><div style="width: 92px; height: 10px; border-radius: 5px; background: {{bar}};"></div></div>
    <div style="display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 8px;"><div style="width: 18px; height: 18px; border-radius: 4px; background: {{bar}};"></div><div style="width: 84px; height: 10px; border-radius: 5px; background: {{bar}};"></div></div>
